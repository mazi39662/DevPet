[package]
name = "devpet"
version = "0.1.0"
description = "DevPet - a desktop companion that monitors AI coding agents"
authors = ["DevPet"]
edition = "2021"
default-run = "devpet"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's hooks.json key order intact when we merge into it.
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
